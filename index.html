<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Pile of Shame Tracker</title>
<style>
  :root {
    --bg: #14161a;
    --panel: #1c1f26;
    --panel-2: #23272f;
    --border: #333844;
    --text: #e7e9ee;
    --muted: #99a0ad;
    --accent: #7c5cff;
    --accent-2: #5b8cff;
    --danger: #e5484d;
    --ok: #46b880;
    --radius: 10px;
    --shadow: 0 8px 30px rgba(0,0,0,.45);
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    margin: 0;
    font: 14px/1.5 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    color: var(--text);
    background: var(--bg);
  }
  button {
    font: inherit;
    color: var(--text);
    background: var(--panel-2);
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 6px 12px;
    cursor: pointer;
  }
  button:hover { border-color: var(--accent); }
  button.primary { background: var(--accent); border-color: var(--accent); color: #fff; }
  button.primary:hover { filter: brightness(1.1); }
  button.ghost { background: transparent; }
  button.danger { color: var(--danger); border-color: transparent; background: transparent; }
  button.danger:hover { border-color: var(--danger); }
  button.small { padding: 3px 8px; font-size: 12px; }
  #btn-sync.sync-ok { color: var(--ok); }
  #btn-sync.sync-warn { color: #e0a33c; }
  #btn-sync.sync-err { color: var(--danger); }
  input, select, textarea {
    font: inherit;
    color: var(--text);
    background: var(--bg);
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 7px 9px;
    width: 100%;
  }
  input[type=color] { padding: 2px; height: 34px; cursor: pointer; }
  label { display: block; font-size: 12px; color: var(--muted); margin: 0 0 4px; }
  .field { margin-bottom: 12px; }
  label.radio-opt { display: flex; align-items: center; gap: 8px; font-size: 14px; color: var(--text); margin: 6px 0; cursor: pointer; }
  label.radio-opt input[type=radio] { width: auto; margin: 0; }
  a { color: var(--accent-2); }

  /* Layout */
  header {
    display: flex; align-items: center; gap: 16px;
    padding: 12px 20px;
    background: var(--panel);
    border-bottom: 1px solid var(--border);
    position: sticky; top: 0; z-index: 5;
    flex-wrap: wrap;
  }
  header h1 { font-size: 18px; margin: 0; display: flex; align-items: center; gap: 8px; }
  .counter {
    background: var(--panel-2); border: 1px solid var(--border);
    padding: 6px 12px; border-radius: 999px; font-size: 13px;
  }
  .counter b { color: var(--accent); }
  .spacer { flex: 1; }
  .topbar-actions { display: flex; gap: 8px; flex-wrap: wrap; }

  .layout { display: flex; min-height: calc(100vh - 58px); }
  aside {
    width: 280px; flex-shrink: 0;
    background: var(--panel);
    border-right: 1px solid var(--border);
    padding: 16px; overflow-y: auto;
  }
  main { flex: 1; padding: 24px; overflow-x: auto; }

  .side-head { display: flex; align-items: center; justify-content: space-between; margin-bottom: 10px; }
  .side-head h2 { font-size: 12px; text-transform: uppercase; letter-spacing: .08em; color: var(--muted); margin: 0; }

  .army-item {
    display: block; width: 100%; text-align: left;
    background: transparent; border: 1px solid transparent;
    border-radius: var(--radius); padding: 10px 12px; margin-bottom: 6px;
  }
  .army-item:hover { background: var(--panel-2); border-color: var(--border); }
  .army-item.active { background: var(--panel-2); border-color: var(--accent); }
  .army-item .name { font-weight: 600; }
  .army-item .game { color: var(--muted); font-size: 12px; }
  .army-item .prog { color: var(--muted); font-size: 12px; margin-top: 4px; }
  .army-item .bar { height: 4px; border-radius: 4px; background: var(--border); margin-top: 6px; overflow: hidden; }
  .army-item .bar > span { display: block; height: 100%; background: var(--ok); }

  .side-tools { margin-top: 16px; border-top: 1px solid var(--border); padding-top: 16px; }
  .side-tools button { width: 100%; margin-bottom: 8px; }

  /* Main */
  .main-head { display: flex; align-items: center; gap: 12px; margin-bottom: 20px; flex-wrap: wrap; }
  .main-head h2 { margin: 0; font-size: 22px; }
  .main-head .meta { color: var(--muted); }
  .empty { color: var(--muted); text-align: center; padding: 60px 20px; }

  table { width: 100%; border-collapse: collapse; }
  th { text-align: left; font-size: 12px; text-transform: uppercase; letter-spacing: .05em; color: var(--muted); padding: 8px 10px; border-bottom: 1px solid var(--border); }
  td { padding: 10px; border-bottom: 1px solid var(--border); vertical-align: middle; }
  tr:hover td { background: var(--panel); }
  .unit-name { font-weight: 600; }
  .unit-notes { color: var(--muted); font-size: 12px; }
  .row-actions { display: flex; gap: 4px; justify-content: flex-end; }
  select.stage { width: auto; min-width: 130px; }

  .badge { display: inline-block; padding: 3px 9px; border-radius: 999px; font-size: 12px; font-weight: 600; border: 1px solid transparent; }
  .stage-badge { min-width: 92px; text-align: center; box-sizing: border-box; }

  .scheme-cell { display: flex; align-items: center; gap: 6px; }
  .swatches { display: inline-flex; }
  .swatches span { width: 14px; height: 14px; border-radius: 3px; border: 1px solid rgba(255,255,255,.2); margin-left: -3px; }
  .swatches span:first-child { margin-left: 0; }

  /* Modal */
  .overlay {
    position: fixed; inset: 0; background: rgba(0,0,0,.6);
    display: flex; align-items: flex-start; justify-content: center;
    padding: 40px 16px; z-index: 20; overflow-y: auto;
  }
  .overlay[hidden] { display: none; }
  .modal {
    background: var(--panel); border: 1px solid var(--border);
    border-radius: 14px; box-shadow: var(--shadow);
    width: 100%; max-width: 620px; padding: 22px;
  }
  .modal h3 { margin: 0 0 16px; }
  .modal-actions { display: flex; gap: 8px; justify-content: flex-end; margin-top: 18px; }
  .row2 { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }

  /* Paint editor */
  .paint-row { display: grid; grid-template-columns: 46px 1fr 1fr 130px 32px; gap: 8px; align-items: center; margin-bottom: 8px; }
  .paint-row .del { padding: 4px 8px; }
  .mix-block { border-left: 3px solid var(--border); padding-left: 8px; margin-bottom: 10px; }
  .mix-block > .paint-row .mix-name { grid-column: 2 / span 2; }
  .mix-swatch { width: 100%; height: 30px; border-radius: 6px; border: 1px solid var(--border); position: relative; }
  .mix-swatch::after { content: "MIX"; position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; font-size: 9px; font-weight: 700; color: #fff; text-shadow: 0 0 3px #000; }
  .mix-comps { margin-left: 16px; }
  .mix-comp-row { display: grid; grid-template-columns: 46px 1fr 1fr 70px 32px; gap: 8px; align-items: center; margin-bottom: 6px; }
  .mix-comp-row .del { padding: 4px 8px; }
  .mix-comps .paint-head { margin-bottom: 4px; }
  .paint-head { font-size: 11px; color: var(--muted); text-transform: uppercase; letter-spacing: .05em; }
  .scheme-list-row { display: flex; align-items: center; gap: 10px; padding: 10px 12px; border: 1px solid var(--border); border-radius: var(--radius); margin-bottom: 8px; }
  .scheme-list-row .scheme-list-name { flex: 1; font-weight: 600; }
  .scheme-block { border: 1px solid var(--border); border-radius: var(--radius); padding: 14px; margin-bottom: 14px; }
  .scheme-block .sb-head { display: flex; gap: 8px; align-items: center; margin-bottom: 10px; }
  .scheme-block .sb-head input { flex: 1; }
  .section-block { border: 1px dashed var(--border); border-radius: 8px; padding: 10px 12px; margin: 10px 0; background: var(--panel-2); }
  .section-block .sec-head { display: flex; gap: 8px; align-items: center; margin-bottom: 8px; }
  .section-block .sec-head input { flex: 1; font-weight: 600; }

  /* Print list */
  #print-area { display: none; }
  #print-area .print-army { page-break-inside: avoid; margin-bottom: 22px; }
  #print-area .print-notes { font-style: italic; }

  @media (max-width: 720px) {
    aside { width: 100%; border-right: none; border-bottom: 1px solid var(--border); }
    .layout { flex-direction: column; }
    .paint-row { grid-template-columns: 40px 1fr 90px 30px; }
    .paint-row .role-cell { grid-column: 2 / span 2; }
    .mix-block > .paint-row .mix-name { grid-column: 2 / span 2; }
    .mix-comps { margin-left: 4px; }
    .mix-comp-row { grid-template-columns: 40px 1fr 60px 30px; }
    .mix-comp-row [data-ck="brand"] { grid-column: 2 / span 2; grid-row: 2; }
    .row2 { grid-template-columns: 1fr; }
  }

  @media print {
    html, body { background: #fff !important; }
    body > *:not(#print-area) { display: none !important; }
    #print-area {
      display: block; color: #000; background: #fff;
      font-family: Georgia, "Times New Roman", serif; padding: 0;
    }
    #print-area h1 { font-size: 22px; margin: 0 0 2px; }
    #print-area .print-sub { color: #444; margin: 0 0 20px; font-family: system-ui, sans-serif; font-size: 12px; }
    #print-area h2 { font-size: 16px; margin: 0 0 6px; border-bottom: 1px solid #000; padding-bottom: 3px; }
    #print-area h2 .print-game { font-weight: normal; color: #555; font-size: 13px; }
    #print-area table { width: 100%; border-collapse: collapse; font-size: 12px; }
    #print-area th, #print-area td { text-align: left; padding: 4px 8px; border-bottom: 1px solid #bbb; vertical-align: top; }
    #print-area th { border-bottom: 1px solid #000; }
    #print-area td.num { text-align: right; white-space: nowrap; }
    #print-area .print-total { margin-top: 16px; font-family: system-ui, sans-serif; font-size: 13px; font-weight: bold; }
    #print-area .print-notes { color: #333; font-size: 11px; }
  }
</style>
</head>
<body>

<header>
  <h1>🎖️ Pile of Shame</h1>
  <span class="counter" id="counter"></span>
  <div class="spacer"></div>
  <div class="topbar-actions">
    <button id="btn-schemes">🎨 Paint Schemes</button>
    <button id="btn-print">🖨 Download list</button>
    <button id="btn-sync" title="Cloud sync">☁ Sync</button>
    <button id="btn-export">⬇ Export</button>
    <button id="btn-import">⬆ Import</button>
    <button id="btn-reset" class="danger">Reset</button>
    <input type="file" id="import-file" accept="application/json,.json" hidden>
  </div>
</header>

<div class="layout">
  <aside>
    <div class="side-head">
      <h2>Armies</h2>
      <button class="small primary" id="btn-add-army">+ Add</button>
    </div>
    <div id="army-list"></div>
  </aside>

  <main id="main"></main>
</div>

<!-- Generic modal host -->
<div class="overlay" id="overlay" hidden>
  <div class="modal" id="modal"></div>
</div>

<!-- Printable model list (hidden on screen, shown only when printing) -->
<div id="print-area" aria-hidden="true"></div>

<script>
"use strict";

// ---------- Constants ----------
const STORAGE_KEY = "pileOfShame";
const STAGES = [
  { id: "unassembled", label: "Unassembled", color: "#8a8f9a" },
  { id: "assembled",   label: "Assembled",   color: "#b07a3c" },
  { id: "primed",      label: "Primed",      color: "#7e8ba3" },
  { id: "painting",    label: "Painting",    color: "#5b8cff" },
  { id: "based",       label: "Based",       color: "#9b6dff" },
  { id: "finished",    label: "Finished",    color: "#46b880" },
];
const FINISHED = "finished";
const ROLES = ["base", "layer", "wash", "shade", "drybrush", "highlight", "edge", "metallic", "contrast", "varnish", "other"];

// ---------- State ----------
let state = load() || seed();
let selectedArmyId = state.armies[0]?.id || null;

function seed() {
  return { version: 1, updatedAt: 0, schemes: [], armies: [] };
}
function load() {
  try {
    const raw = localStorage.getItem(STORAGE_KEY);
    if (!raw) return null;
    const data = JSON.parse(raw);
    return normalize(data);
  } catch (e) {
    console.warn("Failed to load saved data:", e);
    return null;
  }
}
// Write the current state to this browser only (no timestamp bump, no sync).
function writeLocal() {
  try {
    localStorage.setItem(STORAGE_KEY, JSON.stringify(state));
  } catch (e) {
    alert("Could not save data: " + e.message);
  }
}
// Record a user change: stamp it, store it locally and queue a cloud sync.
function save() {
  state.updatedAt = Date.now();
  writeLocal();
  scheduleSync();
}
// Validate / coerce an imported or loaded object into a safe shape.
function normalize(data) {
  if (!data || typeof data !== "object") throw new Error("not an object");
  const out = { version: 1, updatedAt: Number.isFinite(+data.updatedAt) ? +data.updatedAt : 0, schemes: [], armies: [] };
  if (Array.isArray(data.schemes)) {
    const normHex = h => /^#[0-9a-fA-F]{6}$/.test(h) ? h : "#888888";
    const normPaint = p => {
      const base = {
        id: p.id || uid(),
        name: String(p.name || ""),
        role: ROLES.includes(p.role) ? p.role : "base",
      };
      if (p.kind === "mix") {
        const mix = {
          ...base, kind: "mix",
          components: Array.isArray(p.components) ? p.components.map(c => ({
            id: c.id || uid(),
            name: String(c.name || ""),
            brand: String(c.brand || ""),
            hex: normHex(c.hex),
            parts: Number.isFinite(+c.parts) && +c.parts > 0 ? +c.parts : 1,
          })) : [],
        };
        mix.hex = mixHex(mix);
        return mix;
      }
      return { ...base, kind: "paint", brand: String(p.brand || ""), hex: normHex(p.hex) };
    };
    out.schemes = data.schemes.map(s => {
      let sections;
      if (Array.isArray(s.sections)) {
        sections = s.sections.map(sec => ({
          id: sec.id || uid(),
          name: String(sec.name || ""),
          paints: Array.isArray(sec.paints) ? sec.paints.map(normPaint) : [],
        }));
      } else if (Array.isArray(s.paints)) {
        // Migrate old flat-paint schemes into a single default section.
        sections = [{ id: uid(), name: "General", paints: s.paints.map(normPaint) }];
      } else {
        sections = [];
      }
      return { id: s.id || uid(), name: String(s.name || "Untitled scheme"), sections };
    });
  }
  if (Array.isArray(data.armies)) {
    const schemeIds = new Set(out.schemes.map(s => s.id));
    out.armies = data.armies.map(a => ({
      id: a.id || uid(),
      name: String(a.name || "Unnamed army"),
      game: String(a.game || ""),
      notes: String(a.notes || ""),
      schemeId: schemeIds.has(a.schemeId) ? a.schemeId : null,
      units: Array.isArray(a.units) ? a.units.map(u => ({
        id: u.id || uid(),
        name: String(u.name || "Unnamed unit"),
        modelCount: Number.isFinite(+u.modelCount) ? Math.max(0, Math.floor(+u.modelCount)) : 1,
        stage: STAGES.some(s => s.id === u.stage) ? u.stage : "unassembled",
        schemeId: schemeIds.has(u.schemeId) ? u.schemeId : null,
        notes: String(u.notes || ""),
      })) : [],
    }));
  }
  return out;
}

// ---------- Helpers ----------
const uid = () => (crypto.randomUUID ? crypto.randomUUID() : "id-" + Math.random().toString(36).slice(2) + Date.now());
const $ = sel => document.querySelector(sel);
const esc = s => String(s).replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));

// Approximate the mixed color as a parts-weighted RGB average of the components.
function mixHex(mix) {
  const comps = mix.components || [];
  const total = comps.reduce((n, c) => n + c.parts, 0);
  if (!total) return "#888888";
  const rgb = [0, 0, 0];
  comps.forEach(c => {
    for (let i = 0; i < 3; i++) rgb[i] += parseInt(c.hex.slice(1 + i * 2, 3 + i * 2), 16) * c.parts;
  });
  return "#" + rgb.map(v => Math.round(v / total).toString(16).padStart(2, "0")).join("");
}
function paintTitle(p) {
  if (p.kind !== "mix") return p.name || "paint";
  const recipe = p.components.map(c => `${c.parts}× ${c.name || "paint"}`).join(" + ");
  return `${p.name || "Mix"}${recipe ? ` (${recipe})` : ""}`;
}

const findArmy = id => state.armies.find(a => a.id === id);
const findScheme = id => state.schemes.find(s => s.id === id);
const stageDef = id => STAGES.find(s => s.id === id) || STAGES[0];
function effectiveScheme(army, unit) {
  const id = unit.schemeId || army.schemeId;
  return id ? findScheme(id) : null;
}
function armyProgress(army) {
  const total = army.units.length;
  const done = army.units.filter(u => u.stage === FINISHED).length;
  return { total, done, pct: total ? Math.round((done / total) * 100) : 0 };
}
function totalUnfinished() {
  let units = 0, models = 0;
  state.armies.forEach(a => a.units.forEach(u => {
    if (u.stage !== FINISHED) { units++; models += u.modelCount; }
  }));
  return { units, models };
}

function mutate(fn) { fn(); save(); render(); }

// ---------- Render ----------
function render() {
  renderCounter();
  renderSidebar();
  renderMain();
}

function renderCounter() {
  const { units, models } = totalUnfinished();
  $("#counter").innerHTML = `Pile of shame: <b>${units}</b> unit${units === 1 ? "" : "s"} · <b>${models}</b> model${models === 1 ? "" : "s"} unfinished`;
}

function renderSidebar() {
  const list = $("#army-list");
  if (!state.armies.length) {
    list.innerHTML = `<p style="color:var(--muted);font-size:13px">No armies yet. Click <b>+ Add</b> to start your pile.</p>`;
    return;
  }
  list.innerHTML = state.armies.map(a => {
    const p = armyProgress(a);
    return `<button class="army-item ${a.id === selectedArmyId ? "active" : ""}" data-army="${a.id}">
      <div class="name">${esc(a.name)}</div>
      ${a.game ? `<div class="game">${esc(a.game)}</div>` : ""}
      <div class="prog">${p.done}/${p.total} finished${p.total ? ` · ${p.pct}%` : ""}</div>
      <div class="bar"><span style="width:${p.pct}%"></span></div>
    </button>`;
  }).join("");
  list.querySelectorAll("[data-army]").forEach(el => {
    el.onclick = () => { selectedArmyId = el.dataset.army; render(); };
  });
}

function renderMain() {
  const main = $("#main");
  const army = findArmy(selectedArmyId);
  if (!army) {
    main.innerHTML = `<div class="empty"><h2>Welcome to your Pile of Shame 🎖️</h2>
      <p>Create an army on the left to start tracking your miniatures.</p></div>`;
    return;
  }
  const scheme = army.schemeId ? findScheme(army.schemeId) : null;
  const p = armyProgress(army);

  const rows = army.units.length ? army.units.map(u => {
    const eff = effectiveScheme(army, u);
    return `<tr>
      <td>
        <div class="unit-name">${esc(u.name)}</div>
        ${u.notes ? `<div class="unit-notes">${esc(u.notes)}</div>` : ""}
      </td>
      <td>${u.modelCount}</td>
      <td>${stageSelect(u)}</td>
      <td>${schemeCell(eff, u.schemeId ? "override" : (army.schemeId ? "army" : "none"))}</td>
      <td>
        <div class="row-actions">
          <button class="small" data-edit-unit="${u.id}">Edit</button>
          <button class="small danger" data-del-unit="${u.id}">✕</button>
        </div>
      </td>
    </tr>`;
  }).join("") : "";

  main.innerHTML = `
    <div class="main-head">
      <h2>${esc(army.name)}</h2>
      ${army.game ? `<span class="meta">· ${esc(army.game)}</span>` : ""}
      <span class="meta">· ${p.done}/${p.total} finished</span>
      ${scheme ? `<span class="meta">· scheme: ${esc(scheme.name)}</span>` : ""}
      <div class="spacer"></div>
      <button class="small" data-edit-army="${army.id}">Edit army</button>
      <button class="small danger" data-del-army="${army.id}">Delete army</button>
      <button class="primary" id="btn-add-unit">+ Add unit</button>
    </div>
    ${army.notes ? `<p class="meta" style="margin-top:-8px">${esc(army.notes)}</p>` : ""}
    ${army.units.length ? `
      <table>
        <thead><tr><th>Unit</th><th>Models</th><th>Stage</th><th>Paint scheme</th><th></th></tr></thead>
        <tbody>${rows}</tbody>
      </table>` : `<div class="empty">No units yet. Add your first unit to this army.</div>`}
  `;

  // Wire up
  $("#btn-add-unit").onclick = () => openUnitModal(army, null);
  main.querySelector(`[data-edit-army="${army.id}"]`).onclick = () => openArmyModal(army);
  main.querySelector(`[data-del-army="${army.id}"]`).onclick = () => deleteArmy(army);
  main.querySelectorAll("[data-edit-unit]").forEach(el => {
    el.onclick = () => openUnitModal(army, army.units.find(u => u.id === el.dataset.editUnit));
  });
  main.querySelectorAll("[data-del-unit]").forEach(el => {
    el.onclick = () => {
      const u = army.units.find(x => x.id === el.dataset.delUnit);
      if (confirm(`Delete unit "${u.name}"?`)) mutate(() => { army.units = army.units.filter(x => x.id !== u.id); });
    };
  });
  main.querySelectorAll("select.stage").forEach(el => {
    el.onchange = () => mutate(() => {
      const u = army.units.find(x => x.id === el.dataset.unit);
      if (u) u.stage = el.value;
    });
  });
}

function stageSelect(unit) {
  const d = stageDef(unit.stage);
  const opts = STAGES.map(s => `<option value="${s.id}" ${s.id === unit.stage ? "selected" : ""}>${s.label}</option>`).join("");
  return `<span class="badge stage-badge" style="background:${d.color}22;color:${d.color};border-color:${d.color}55;margin-right:8px">${d.label}</span>
    <select class="stage" data-unit="${unit.id}">${opts}</select>`;
}

function schemeCell(scheme, source) {
  if (!scheme) return `<span class="meta" style="color:var(--muted)">—</span>`;
  const allPaints = scheme.sections.flatMap(sec => sec.paints);
  const dots = allPaints.slice(0, 8).map(p => `<span style="background:${p.hex}" title="${esc(paintTitle(p))}"></span>`).join("");
  const tag = source === "override" ? " (override)" : "";
  return `<div class="scheme-cell"><span class="swatches">${dots}</span> <span>${esc(scheme.name)}${tag}</span></div>`;
}

// Save without full re-render of the app; re-render only the current modal view.
function mutateNoRender(fn, rerender) { fn(); save(); rerender(); }

function schemeListRow(s) {
  const allPaints = s.sections.flatMap(sec => sec.paints);
  const dots = allPaints.slice(0, 8).map(p => `<span style="background:${p.hex}" title="${esc(paintTitle(p))}"></span>`).join("");
  return `
    <div class="scheme-list-row" data-scheme="${s.id}">
      <span class="swatches">${dots}</span>
      <span class="scheme-list-name">${esc(s.name) || "Untitled scheme"}</span>
      <button class="small" data-edit-scheme>Edit</button>
      <button class="small danger" data-del-scheme>Delete</button>
    </div>`;
}

function wireSchemeList() {
  document.querySelectorAll("#scheme-list [data-scheme]").forEach(row => {
    const s = findScheme(row.dataset.scheme);
    if (!s) return;
    row.querySelector("[data-edit-scheme]").onclick = () => openSchemeEditor(s.id);
    row.querySelector("[data-del-scheme]").onclick = () => {
      if (!confirm(`Delete scheme "${s.name}"? Armies/units using it will fall back to no scheme.`)) return;
      mutateNoRender(() => {
        state.schemes = state.schemes.filter(x => x.id !== s.id);
        state.armies.forEach(a => {
          if (a.schemeId === s.id) a.schemeId = null;
          a.units.forEach(u => { if (u.schemeId === s.id) u.schemeId = null; });
        });
      }, openSchemeManager);
    };
  });
}

function sectionBlock(sec) {
  const head = `
    <div class="paint-row paint-head">
      <div></div><div>Name</div><div>Brand / range</div><div>Role</div><div></div>
    </div>`;

  return `
    <div class="section-block" data-section="${sec.id}">

}

function mixBlock(m) {
  const comps = m.components.map(c => `
    <div class="mix-comp-row" data-comp="${c.id}">
      <input type="color" value="${c.hex}" data-ck="hex">
      <input value="${esc(c.name)}" data-ck="name" placeholder="Paint name">
      <input value="${esc(c.brand)}" data-ck="brand" placeholder="Brand">
      <input type="number" min="0.1" step="any" value="${c.parts}" data-ck="parts" title="Parts in the mix">
      <button class="small danger del" title="Remove component">✕</button>
    </div>`).join("");
  return `
    <div class="mix-block" data-paint="${m.id}">
      <div class="paint-row">
        <div class="mix-swatch" style="background:${m.hex}" title="Approximate mixed color"></div>
        <input class="mix-name" value="${esc(m.name)}" data-k="name" placeholder="Mix name (e.g. Skin midtone)">
        <select data-k="role" class="role-cell">${ROLES.map(r => `<option ${r === m.role ? "selected" : ""}>${r}</option>`).join("")}</select>
        <button class="small danger del" data-del-mix title="Remove mix">✕</button>
      </div>
      <div class="mix-comps">
        ${m.components.length ? `<div class="mix-comp-row paint-head"><div></div><div>Paint</div><div>Brand</div><div>Parts</div><div></div></div>` : ""}
        ${comps}
        <button class="small" data-add-comp>+ Add paint to mix</button>

}

function wireSchemeEditor(s) {
  const rerender = () => openSchemeEditor(s.id);
  document.querySelector("[data-scheme-name]").onchange = e => { s.name = e.target.value.trim() || "Untitled scheme"; save(); };
  document.querySelector("[data-del-scheme]").onclick = () => {
    if (!confirm(`Delete scheme "${s.name}"? Armies/units using it will fall back to no scheme.`)) return;
    mutateNoRender(() => {
      state.schemes = state.schemes.filter(x => x.id !== s.id);
      state.armies.forEach(a => {
        if (a.schemeId === s.id) a.schemeId = null;
        a.units.forEach(u => { if (u.schemeId === s.id) u.schemeId = null; });
      });
    }, openSchemeManager);
  };
  document.querySelector("[data-add-section]").onclick = () => mutateNoRender(() => {
    s.sections.push({ id: uid(), name: "", paints: [] });
  }, rerender);
  document.querySelectorAll("[data-section]").forEach(secEl => {
    const sec = s.sections.find(x => x.id === secEl.dataset.section);
    if (!sec) return;
    secEl.querySelector("[data-section-name]").onchange = e => { sec.name = e.target.value.trim(); save(); };
    secEl.querySelector("[data-del-section]").onclick = () => {
      if (sec.paints.length && !confirm(`Remove section "${sec.name || "unnamed"}" and its ${sec.paints.length} paint(s)/mix(es)?`)) return;
      mutateNoRender(() => { s.sections = s.sections.filter(x => x.id !== sec.id); }, rerender);
    };
    secEl.querySelector("[data-add-paint]").onclick = () => mutateNoRender(() => {
      sec.paints.push({ id: uid(), kind: "paint", name: "", brand: "", role: "base", hex: "#888888" });
    }, rerender);
    secEl.querySelector("[data-add-mix]").onclick = () => mutateNoRender(() => {
      const mix = { id: uid(), kind: "mix", name: "", role: "base", components: [
        { id: uid(), name: "", brand: "", hex: "#888888", parts: 1 },
        { id: uid(), name: "", brand: "", hex: "#ffffff", parts: 1 },
      ] };
      mix.hex = mixHex(mix);
      sec.paints.push(mix);
    }, rerender);
    secEl.querySelectorAll("[data-paint]").forEach(prow => {
      const p = sec.paints.find(x => x.id === prow.dataset.paint);
      if (!p) return;
      if (p.kind === "mix") { wireMix(prow, p, sec, rerender); return; }
      prow.querySelectorAll("[data-k]").forEach(inp => {
        inp.onchange = () => { p[inp.dataset.k] = inp.value; save(); };
      });
      prow.querySelector(".del").onclick = () => mutateNoRender(() => {
        sec.paints = sec.paints.filter(x => x.id !== p.id);
      }, rerender);
    });
  });
}

function wireMix(el, m, sec, rerender) {
  const swatch = el.querySelector(".mix-swatch");
  el.querySelectorAll("[data-k]").forEach(inp => {
    inp.onchange = () => { m[inp.dataset.k] = inp.value; save(); };
  });
  el.querySelector("[data-del-mix]").onclick = () => {
    if (m.components.length && !confirm(`Remove mix "${m.name || "unnamed"}"?`)) return;
    mutateNoRender(() => { sec.paints = sec.paints.filter(x => x.id !== m.id); }, rerender);
  };
  el.querySelector("[data-add-comp]").onclick = () => mutateNoRender(() => {
    m.components.push({ id: uid(), name: "", brand: "", hex: "#888888", parts: 1 });
    m.hex = mixHex(m);
  }, rerender);
  el.querySelectorAll("[data-comp]").forEach(crow => {
    const c = m.components.find(x => x.id === crow.dataset.comp);
    if (!c) return;
    crow.querySelectorAll("[data-ck]").forEach(inp => {
      const update = () => {
        if (inp.dataset.ck === "parts") {
          const v = +inp.value;
          if (!(Number.isFinite(v) && v > 0)) return;
          c.parts = v;
        } else c[inp.dataset.ck] = inp.value;
        m.hex = mixHex(m);
        swatch.style.background = m.hex;
        save();
      };
      inp.onchange = update;
      if (inp.type === "color" || inp.dataset.ck === "parts") inp.oninput = update;
    });
    crow.querySelector(".del").onclick = () => mutateNoRender(() => {
      m.components = m.components.filter(x => x.id !== c.id);
      m.hex = mixHex(m);
    }, rerender);
  });
}

function exportData() {

  const blob = new Blob([JSON.stringify(state, null, 2)], { type: "application/json" });
  const url = URL.createObjectURL(blob);
  const a = document.createElement("a");
  a.href = url; a.download = `pile-of-shame-${stamp}.json`;
  document.body.appendChild(a); a.click(); a.remove();
  URL.revokeObjectURL(url);
}
function importData(file) {
  const reader = new FileReader();
  reader.onload = () => {
    try {
      const parsed = JSON.parse(reader.result);
      const clean = normalize(parsed);
      if (!confirm("Import will replace your current data. Continue?")) return;
      state = clean;
      selectedArmyId = state.armies[0]?.id || null;
      save(); render();
      alert("Import successful.");
    } catch (e) {
      alert("Could not import file — it doesn't look like a valid Pile of Shame backup.\n\n" + e.message);
    }
  };
  reader.onerror = () => alert("Failed to read the file.");
  reader.readAsText(file);
}

// ---------- Cloud sync (GitHub Gist) ----------
// Each user pastes their own GitHub token (classic, "gist" scope only). The app keeps
// the data in a secret gist in that user's account. Versions are identified by
// state.updatedAt; syncCfg.syncedAt is the version this device last agreed on with
// the cloud, so "changed" means "differs from syncedAt" (immune to clock skew).
const SYNC_KEY = "pileOfShameSync";
const GIST_FILE = "pile-of-shame.json";
const GIST_DESC = "Pile of Shame Tracker data (managed by the app)";
const SYNC_DELAY = 2000;

let syncCfg = loadSyncCfg();      // { token, gistId, syncedAt, lastSyncTime }
let syncStatus = syncCfg.token ? "pending" : "off"; // off | pending | syncing | synced | offline | error
let syncError = "";
let syncTimer = null;
let syncRunning = null;
let syncAgain = false;
let lastScopes = null;

function loadSyncCfg() {
  try { return JSON.parse(localStorage.getItem(SYNC_KEY)) || {}; } catch { return {}; }
}
function saveSyncCfg() {
  try {
    if (syncCfg.token) localStorage.setItem(SYNC_KEY, JSON.stringify(syncCfg));
    else localStorage.removeItem(SYNC_KEY);
  } catch (e) { console.warn("Could not store sync settings:", e); }
}

async function gh(path, opts = {}) {
  let res;
  try {
    res = await fetch("https://api.github.com" + path, {
      ...opts,
      cache: "no-store",
      headers: {
        Accept: "application/vnd.github+json",
        Authorization: `Bearer ${syncCfg.token}`,
        ...(opts.body ? { "Content-Type": "application/json" } : {}),
      },
    });
  } catch {
    const err = new Error("Can't reach GitHub — you seem to be offline. Changes are kept on this device and synced later.");
    err.offline = true;
    throw err;
  }
  lastScopes = res.headers.get("X-OAuth-Scopes");
  if (!res.ok) {
    let msg = `GitHub API error ${res.status}.`;
    if (res.status === 401) msg = "GitHub rejected the token (wrong, revoked or expired). Disconnect and connect again with a new token.";
    else if (res.status === 403 && res.headers.get("X-RateLimit-Remaining") === "0") msg = "GitHub rate limit reached — sync will retry later.";
    else if (res.status === 404 && opts.method === "POST") msg = "This token can't create gists. Make sure it has the 'gist' scope.";
    const err = new Error(msg);
    err.status = res.status;
    throw err;
  }
  return res.status === 204 ? null : res.json();
}

async function checkToken() {
  await gh("/user");
  // Classic tokens report their scopes; fine-grained tokens don't send this header.
  if (lastScopes !== null && !lastScopes.split(",").map(s => s.trim()).includes("gist")) {
    throw new Error("This token is missing the 'gist' scope. Create a classic token and tick only 'gist'.");
  }
}

// Find this user's data gist, or create it from the current local data.
async function findOrCreateGist() {
  for (let page = 1; page <= 10; page++) {
    const list = await gh(`/gists?per_page=100&page=${page}`);
    const hit = list.find(g => g.files && g.files[GIST_FILE]);
    if (hit) return { id: hit.id, created: false };
    if (list.length < 100) break;
  }
  ensureStamp();
  const g = await gh("/gists", {
    method: "POST",
    body: JSON.stringify({ description: GIST_DESC, public: false, files: { [GIST_FILE]: { content: JSON.stringify(state, null, 2) } } }),
  });
  return { id: g.id, created: true };
}

async function readRemote() {
  const g = await gh(`/gists/${syncCfg.gistId}`);
  const f = g.files && g.files[GIST_FILE];
  if (!f) return null;
  let text = f.content;
  if (f.truncated) text = await (await fetch(f.raw_url, { cache: "no-store" })).text();
  if (!text || !text.trim()) return null;
  try { return normalize(JSON.parse(text)); }
  catch { throw new Error("The cloud copy in your gist is not valid Pile of Shame data. Fix or delete the gist file, then sync again."); }
}

// Data saved before sync existed has updatedAt 0; give it a real stamp before it is
// shared so every device can tell versions apart.
function ensureStamp() {
  if (!state.updatedAt) { state.updatedAt = Date.now(); writeLocal(); }
}

// Canonical form of the user data (ignores updatedAt and key order).
function canon(s) {
  const n = normalize(JSON.parse(JSON.stringify(s)));
  return JSON.stringify({ schemes: n.schemes, armies: n.armies });
}
function sameData(a, b) { return canon(a) === canon(b); }

async function pushRemote() {
  ensureStamp();
  // Snapshot first: edits made while the request is in flight get their own sync.
  const at = state.updatedAt;
  const content = JSON.stringify(state, null, 2);
  await gh(`/gists/${syncCfg.gistId}`, { method: "PATCH", body: JSON.stringify({ files: { [GIST_FILE]: { content } } }) });
  syncCfg.syncedAt = at;
}

function isEmptyState(s) { return !s.armies.length && !s.schemes.length; }
function editingModalOpen() { return !$("#overlay").hidden && !$("#sync-modal"); }

function adoptRemote(remote) {
  if (editingModalOpen()) closeModal(); // open editors hold references into the old state
  state = remote;
  writeLocal();
  syncCfg.syncedAt = remote.updatedAt;
  if (!findArmy(selectedArmyId)) selectedArmyId = state.armies[0]?.id || null;
  render();
}

async function runSync(retried) {
  setSyncStatus("syncing");
  if (!syncCfg.gistId) {
    const { id, created } = await findOrCreateGist();
    syncCfg.gistId = id;
    if (created) syncCfg.syncedAt = state.updatedAt;
    saveSyncCfg();
    if (created) return finishSync();
  }

  let remote;
  try {
    remote = await readRemote();
  } catch (e) {
    if (e.status === 404 && !retried) { // gist was deleted — look again / recreate
      syncCfg.gistId = null;
      return runSync(true);
    }
    throw e;
  }

  if (!remote) {
    await pushRemote();
    return finishSync();
  }

  // Compare actual content: version stamps alone can't be trusted when data predates
  // sync (updatedAt 0 on several devices would look "identical").
  if (sameData(remote, state)) {
    if (!remote.updatedAt) {
      await pushRemote(); // give the shared version a real stamp
    } else {
      state.updatedAt = remote.updatedAt;
      writeLocal();
      syncCfg.syncedAt = remote.updatedAt;
    }
    return finishSync();
  }

  const base = syncCfg.syncedAt || 0;
  // base 0 = this device never agreed on a version with the cloud.
  const localChanged = base === 0 ? !isEmptyState(state) : state.updatedAt !== base;
  const remoteChanged = base === 0 ? true : remote.updatedAt !== base;

  if (localChanged && remoteChanged) {
    const keepLocal = confirm(
      "Your pile was changed on this device AND on another device since the last sync.\n\n" +
      "OK = keep THIS device's version (the cloud's version stays in the gist's revision history)\n" +
      "Cancel = use the CLOUD version (this device's version will be downloaded as a backup file first)"
    );
    if (keepLocal) await pushRemote();
    else {
      exportData();
      adoptRemote(remote);
      if (!state.updatedAt) await pushRemote();
    }
  } else if (localChanged) {
    await pushRemote();
  } else if (remoteChanged) {
    adoptRemote(remote);
    if (!state.updatedAt) await pushRemote(); // cloud copy predates sync: stamp it
  }
  finishSync();
}

function finishSync() {
  syncCfg.lastSyncTime = Date.now();
  saveSyncCfg();
  setSyncStatus("synced");
}

function syncNow() {
  clearTimeout(syncTimer);
  if (!syncCfg.token) return Promise.resolve();
  if (syncRunning) { syncAgain = true; return syncRunning; }
  syncRunning = runSync(false)
    .catch(e => {
      console.warn("Sync failed:", e);
      saveSyncCfg();
      setSyncStatus(e.offline ? "offline" : "error", e.message);
    })
    .finally(() => {
      syncRunning = null;
      if (syncAgain) { syncAgain = false; syncNow(); }
    });
  return syncRunning;
}

function scheduleSync() {
  if (!syncCfg.token) return;
  clearTimeout(syncTimer);
  if (!syncRunning) setSyncStatus("pending");
  syncTimer = setTimeout(syncNow, SYNC_DELAY);
}

function setSyncStatus(status, error = "") {
  syncStatus = status;
  syncError = error;
  updateSyncUi();
}

function syncStatusText() {
  const last = syncCfg.lastSyncTime ? ` · last synced ${new Date(syncCfg.lastSyncTime).toLocaleString()}` : "";
  return {
    off: "Not connected",
    pending: "Changes waiting to sync…",
    syncing: "Syncing…",
    synced: "Up to date" + last,
    offline: "Offline — will sync when back online" + last,
    error: "Sync error: " + syncError,
  }[syncStatus];
}

function updateSyncUi() {
  const btn = $("#btn-sync");
  btn.textContent = {
    off: "☁ Sync", pending: "☁ Pending", syncing: "☁ Syncing…",
    synced: "☁ Synced", offline: "☁ Offline", error: "⚠ Sync error",
  }[syncStatus];
  btn.className = { synced: "sync-ok", offline: "sync-warn", error: "sync-err" }[syncStatus] || "";
  btn.title = "Cloud sync: " + syncStatusText();
  const st = $("#sync-modal-status");
  if (st) st.textContent = syncStatusText();
}

function openSyncModal() {
  const connected = !!syncCfg.token;
  openModal(`<div id="sync-modal">
    <h3>☁ Cloud sync (GitHub Gist)</h3>
    ${connected ? `
      <p>Status: <b id="sync-modal-status"></b></p>
      ${syncCfg.gistId ? `<p><a href="https://gist.github.com/${esc(syncCfg.gistId)}" target="_blank" rel="noopener">Open your data gist</a> — older versions are kept in its revision history.</p>` : ""}
      <div class="modal-actions">
        <button class="danger" id="m-disconnect">Disconnect</button>
        <button id="m-cancel">Close</button>
        <button class="primary" id="m-sync">Sync now</button>
      </div>
    ` : `
      <p style="color:var(--muted)">Keep your pile in a secret gist in <b>your own</b> GitHub account and use it on all your devices.</p>
      <ol style="color:var(--muted);padding-left:18px">
        <li><a href="https://github.com/settings/tokens/new?scopes=gist&description=Pile%20of%20Shame%20sync" target="_blank" rel="noopener">Create a classic token</a> with only the <b>gist</b> scope.</li>
        <li>Paste it below. Use the same token on each of your devices.</li>
      </ol>
      <div class="field"><label>GitHub token</label><input id="f-token" type="password" autocomplete="off" spellcheck="false" placeholder="ghp_…"></div>
      <p id="sync-modal-err" style="color:var(--danger)"></p>
      <div class="modal-actions">
        <button id="m-cancel">Cancel</button>
        <button class="primary" id="m-connect">Connect</button>
      </div>
    `}
    <p style="color:var(--muted);font-size:12px">The token is stored only in this browser — only connect on devices you trust.</p>
  </div>`);
  $("#m-cancel").onclick = closeModal;

  if (connected) {
    updateSyncUi();
    $("#m-sync").onclick = () => syncNow();
    $("#m-disconnect").onclick = () => {
      if (!confirm("Stop syncing on this device?\n\nYour data stays on this device and in the gist.")) return;
      clearTimeout(syncTimer);
      syncCfg = {};
      saveSyncCfg();
      setSyncStatus("off");
      closeModal();
    };
    return;
  }

  const connect = async () => {
    const token = $("#f-token").value.trim();
    if (!token) return;
    const btn = $("#m-connect");
    btn.disabled = true; btn.textContent = "Connecting…";
    syncCfg = { token };
    try {
      await checkToken();
    } catch (e) {
      syncCfg = {};
      $("#sync-modal-err").textContent = e.message;
      btn.disabled = false; btn.textContent = "Connect";
      return;
    }
    saveSyncCfg();
    openSyncModal();
    syncNow();
  };
  $("#m-connect").onclick = connect;
  $("#f-token").onkeydown = e => { if (e.key === "Enter") connect(); };
  $("#f-token").focus();
}

// Pick up changes from other devices when coming back to the app or back online.
document.addEventListener("visibilitychange", () => {
  if (document.visibilityState === "visible" && syncCfg.token && !editingModalOpen()) syncNow();
});
window.addEventListener("online", () => { if (syncCfg.token) syncNow(); });

// ---------- Top bar wiring ----------
$("#btn-add-army").onclick = () => openArmyModal(null);
$("#btn-schemes").onclick = openSchemeManager;
$("#btn-print").onclick = openPrintModal;
$("#btn-sync").onclick = openSyncModal;
$("#btn-export").onclick = exportData;
$("#btn-import").onclick = () => $("#import-file").click();
$("#import-file").onchange = e => { if (e.target.files[0]) importData(e.target.files[0]); e.target.value = ""; };
$("#btn-reset").onclick = () => {
  const cloud = syncCfg.token ? "\n\nCloud sync is on, so the cloud copy will be cleared too (older versions stay in the gist's revision history)." : "";
  if (!confirm("Reset ALL data? This clears every army, unit and scheme. Export a backup first if unsure." + cloud)) return;
  state = seed(); selectedArmyId = null; save(); render();
};

// ---------- Go ----------
render();
updateSyncUi();
if (syncCfg.token) syncNow();
</script>
</body>
</html>
