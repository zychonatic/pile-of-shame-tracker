<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#2a2140"/>
      <stop offset="1" stop-color="#14161a"/>
    </linearGradient>
    <linearGradient id="handle" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#9d84ff"/>
      <stop offset="1" stop-color="#5b3fd9"/>
    </linearGradient>
  </defs>
  <rect width="512" height="512" rx="112" fill="url(#bg)"/>
  <!-- pile of miniature bases, bottom to top: unpainted grey -> primed -> painting -> finished -->
  <g>
    <rect x="96" y="356" width="320" height="44" fill="#5d626d"/>
    <ellipse cx="256" cy="400" rx="160" ry="34" fill="#5d626d"/>
    <ellipse cx="256" cy="356" rx="160" ry="34" fill="#8a8f9a"/>

    <rect x="124" y="296" width="264" height="40" fill="#5a6680"/>
    <ellipse cx="256" cy="336" rx="132" ry="28" fill="#5a6680"/>
    <ellipse cx="256" cy="296" rx="132" ry="28" fill="#7e8ba3"/>

    <rect x="150" y="242" width="212" height="36" fill="#3d68d6"/>
    <ellipse cx="256" cy="278" rx="106" ry="23" fill="#3d68d6"/>
    <ellipse cx="256" cy="242" rx="106" ry="23" fill="#5b8cff"/>

    <rect x="176" y="194" width="160" height="32" fill="#2f8f61"/>
    <ellipse cx="256" cy="226" rx="80" ry="18" fill="#2f8f61"/>
    <ellipse cx="256" cy="194" rx="80" ry="18" fill="#46b880"/>
  </g>
  <!-- paintbrush leaning over the pile -->
  <g transform="rotate(38 256 256)">
    <rect x="236" y="-10" width="40" height="190" rx="20" fill="url(#handle)"/>
    <rect x="232" y="172" width="48" height="40" rx="6" fill="#cfd3dc"/>
    <path d="M234 210 h44 c4 40 -8 70 -22 92 c-14 -22 -26 -52 -22 -92 z" fill="#f2c14e"/>
    <path d="M241 262 c4 18 9 30 15 40 c6 -10 11 -22 15 -40 z" fill="#e8533f"/>
  </g>
</svg>
